<!doctype html><html lang="en"><head><meta charset="utf-8"><title>ARGOS login</title><link rel="icon" href="data:,">
<link rel="stylesheet" href="/static/app.css"></head>
<body><main class="narrow"><h1>ARGOS Defense</h1>

<form method="post" action="/login"><label>Token <input type="password" name="token" autocomplete="off" required></label> <button type="submit">Open</button></form>
</main></body></html>
