id: ARG-IOC-001
version: 1
title: Indicator list match (validity evaluated at event time)
description: |
  Destination/source matches a configured indicator. Validity is evaluated against
  the event time. Expired indicators are historical context only - never an
  attribution to a person or group and never an automatic block.
family: ioc_context
status: test
validation_status: synthetic-scenario tests only
observation_vantage: [victim_network, managed_endpoint, identity_cloud]
required_telemetry: [event_time]
select:
  any:
    - {field: src_ip, op: ioc_any}
    - {field: dst_ip, op: ioc_any}
    - {field: domain, op: ioc_any}
group_by: [remote]
window_s: 86400
aggregate: {type: each}
reference: {type: not_applicable, description: configured indicator list with validity intervals}
severity: medium
base_confidence: medium
contributes:
  threat: {activity: Indicator match, suspicion: suspicious}
  purpose: {observed_action: contact with listed indicator, hypothesis: unknown, stage: indicator}
evidence_family: ioc_match
required_evidence: Records with IP/domain fields + IOC list entry
explanation: "{count} record(s) matched configured indicators."
alternatives: [infrastructure re-assigned to new owner, shared hosting, stale indicator]
false_positives: [CDN/shared IPs]
resolving_data: [current ownership of the infrastructure, indicator source update]
sources: ["IOC list files in rules/iocs (each entry carries source and validity)"]
