id: ARG-COLL-002
version: 1
title: Secret reads across several vaults in a short period
description: One principal read secrets from at least 3 distinct vaults/resources within 10 minutes.
family: collection_exfil_persistence
status: test
validation_status: synthetic-scenario tests only
observation_vantage: [identity_cloud]
required_telemetry: [event_time, tenant_id, resource]
select: {all: [{field: event_kind, op: eq, value: cloud_operation}, {field: action, op: eq, value: secret_read}]}
group_by: [tenant_id, app_id]
window_s: 600
aggregate: {type: threshold, min_count: 3, distinct_field: resource, min_distinct: 3}
reference: {type: explicit_threshold, description: ">=3 distinct vaults within 600s"}
severity: high
base_confidence: medium
contributes:
  threat: {activity: Bulk secret reads across vaults, suspicion: suspicious}
  purpose: {observed_action: secret reads across vaults, hypothesis: collection, stage: observed_success}
evidence_family: multi_vault_reads
required_evidence: Secret read audit records with resource
explanation: "{group} read secrets from {distinct} vaults within {window_s}s."
alternatives: [deployment pipeline, configuration management]
false_positives: [CI/CD deployments]
resolving_data: [deployment logs, app owner confirmation]
sources: ["Microsoft Security blog 2026-10-21 (bulk Key Vault secret reads across multiple vaults)"]
