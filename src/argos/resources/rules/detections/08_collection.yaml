id: ARG-PERS-001
version: 1
title: Persistence mechanism created (scheduled task / service / Run key / web shell file)
description: |
  Creation of a persistence mechanism. The stage distinguishes an attempt
  (outcome failure/unknown) from an observed success; the rule reports both with
  the outcome shown in evidence.
family: collection_exfil_persistence
status: test
validation_status: synthetic-scenario tests only
observation_vantage: [managed_endpoint]
required_telemetry: [event_time, host]
select:
  any:
    - {all: [{field: event_kind, op: eq, value: process_start}, {field: process_name, op: in, value: [schtasks.exe, sc.exe, reg.exe, crontab, systemctl]},
             {field: process_command_line, op: regex, value: "(/create|create |\\\\CurrentVersion\\\\Run| -e|enable )"}]}
    - {all: [{field: event_kind, op: eq, value: file_create}, {field: file_ext, op: in, value: [.aspx, .ashx, .jsp, .jspx, .php]},
             {field: file_path, op: regex, value: "(inetpub|wwwroot|htdocs|webapps|/var/www)"}]}
group_by: [host]
window_s: 3600
aggregate: {type: each}
reference: {type: not_applicable, description: command/path patterns}
severity: high
base_confidence: medium
contributes:
  threat: {activity: Persistence mechanism created, suspicion: likely_malicious}
  purpose: {observed_action: persistence artifact created, hypothesis: persistence, stage: attempt}
evidence_family: persistence_artifact
required_evidence: Process creation command lines or file creation paths
explanation: "{count} persistence-related event(s) on {group}."
alternatives: [software installation, admin-created scheduled task, web deployment]
false_positives: [deployments writing .aspx/.jsp files]
resolving_data: [deployment records, file hash and content review]
sources: ["FBI FLASH-20261113-001 (web shells *.aspx/*.jsp in unexpected paths)"]
recommendation: Compare the artifact against deployment records; preserve the file and logs before removal.
