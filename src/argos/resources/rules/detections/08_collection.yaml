# Family 8 - collection sequences, potentially anomalous transfers, persistence.
id: ARG-COLL-001
version: 1
title: Archive created then large outbound transfer from the same host
description: |
  An archive file was created and the same host then sent a large amount of data to
  a public address. "Possible exfiltration" is a hypothesis: volume does not prove
  data theft and the archive content is unknown.
family: collection_exfil_persistence
status: test
validation_status: synthetic-scenario tests only
observation_vantage: [managed_endpoint, victim_network]
required_telemetry: [event_time, host]
select: {field: event_kind, op: in, value: [file_create, network_connection]}
group_by: [host]
window_s: 1800
aggregate:
  type: sequence
  steps:
    - {name: archive_created, where: {all: [{field: event_kind, op: eq, value: file_create}, {field: file_ext, op: in, value: [.zip, .7z, .rar, .gz, .tgz, .tar]}]}}
    - name: large_outbound
      where: {all: [{field: event_kind, op: eq, value: network_connection}, {field: dst_is_private, op: eq, value: false}, {field: bytes_src_to_dst, op: gte, value: 50000000}]}
reference: {type: explicit_threshold, description: ">=50MB sent (bytes_src_to_dst with declared direction) within 30 min after archive creation"}
severity: high
base_confidence: medium
contributes:
  threat: {activity: Staging and large outbound transfer, suspicion: suspicious}
  purpose: {observed_action: archive written then large upload, hypothesis: possible_exfiltration, stage: indicator}
evidence_family: archive_then_upload
required_evidence: File creation + connection with direction-declared byte counters on same host
explanation: "Archive then >=50MB outbound from {group} within {window_s}s. Data theft is NOT established."
alternatives: [backup upload, software distribution, cloud sync]
false_positives: [backups, developer artifact uploads]
missing_visibility_hints: ["byte counts require a declared direction; records without bytes_basis are not used"]
resolving_data: [destination ownership, DLP/proxy content logs, archive contents]
sources: ["FBI FLASH-20261113-001 (staging and exfiltration, outbound structured data transfers)"]
suppressible_by_registry: true
