id: ARG-AUTH-003
version: 2
title: Uninterrupted failed sign-ins from one source, then success from that source
description: |
  The same tenant+account had an uninterrupted run of failed sign-ins from one
  source address (no success from that source in between), followed by a successful
  sign-in from the same source. v2 (2026-11-20): v1 counted failures that were
  interleaved with successes and spread across unrelated sources, which alerted on
  ordinary intermittent failures (see docs/AUTH_RULE_EVALUATION.md). Speed is not
  required: slow guessing still matches. Successful authentication is NOT evidence of
  data access or exfiltration; the follow-up check reports whether data access was
  observed within coverage.
family: auth_sequence
status: test
validation_status: synthetic labeled tuning + held-out sequences only (docs/AUTH_RULE_EVALUATION.md); real-world accuracy NOT MEASURED
observation_vantage: [identity_cloud]
required_telemetry: [event_time, tenant_id, user, outcome, src_ip]
select: {field: event_kind, op: eq, value: authentication}
group_by: [tenant_id, user, src_ip]
window_s: 86400
aggregate:
  type: sequence
  steps:
    - name: failed_signins
      where: {field: outcome, op: eq, value: failure}
      min_count: 5
      reset_where: {field: outcome, op: eq, value: success}
    - {name: successful_signin, where: {field: outcome, op: eq, value: success}}
reference: {type: explicit_threshold, description: ">=5 consecutive failures from one source for one tenant+account, then success from that source, within 24h"}
severity: medium
base_confidence: medium
contributes:
  threat: {activity: Possible credential guessing success, suspicion: suspicious}
  purpose: {observed_action: uninterrupted failures then successful authentication from the same source, hypothesis: credential_access, stage: observed_success}
evidence_family: auth_fail_then_success
required_evidence: Authentication records with tenant, account, outcome and source address
explanation: "{group}: uninterrupted failures then a success from the same source within {window_s}s. No claim of data access is made."
alternatives: [user mistyping repeatedly on their own device, device with a stale saved password that is later updated, password manager sync delay]
false_positives: [repeated typos from the user's own device (labeled benign scenario B2 still alerts)]
missing_visibility_hints: ["attacks rotating source addresses for every attempt are not matched by this rule (known gap, see AUTH_RULE_EVALUATION.md)"]
resolving_data: [whether the source previously authenticated successfully for this account, device/MFA details of the success, resource access logs after the success]
sources: ["Microsoft Security blog 2026-10-21: a successful authentication does not by itself show data access or exfiltration"]
source_history:
  field: src_ip
  where: {all: [{field: event_kind, op: eq, value: authentication}, {field: outcome, op: eq, value: success}]}
  join_fields: [tenant_id, user]
absence_check:
  where: {any: [{field: action, op: in, value: [secret_read, file_read, mailbox_read, blob_read, data_download, graph_read]}]}
  within_s: 7200
  label: data access by the same identity (any source) after the successful sign-in
  vantage: identity_cloud
  join_fields: [tenant_id, user]
