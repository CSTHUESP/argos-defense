# Family 3 - authentication failures, subsequent success and sensitive actions.
id: ARG-AUTH-001
version: 1
title: Password spray pattern (many accounts, one source)
description: Failed authentications against many distinct accounts from one source IP.
family: auth_sequence
status: test
validation_status: synthetic-scenario tests only
observation_vantage: [identity_cloud]
required_telemetry: [event_time, src_ip, user, outcome]
select:
  all:
    - {field: event_kind, op: eq, value: authentication}
    - {field: outcome, op: eq, value: failure}
group_by: [src_ip]
window_s: 3600
aggregate: {type: threshold, min_count: 10, distinct_field: user, min_distinct: 10}
reference: {type: explicit_threshold, description: ">=10 distinct accounts failing from one source within 1h"}
severity: medium
base_confidence: medium
contributes:
  threat: {activity: Password spraying, suspicion: suspicious}
  automation: consistent_with_automation
  purpose: {observed_action: failed sign-ins across many accounts, hypothesis: credential_access, stage: attempt}
evidence_family: auth_failure_spread
required_evidence: Failed authentication records with account and source IP
explanation: "{distinct} distinct accounts failed authentication from {group} within {window_s}s."
alternatives: [misconfigured service with stale credentials, shared NAT egress for many users, SSO outage]
false_positives: [password-expiry waves behind a shared proxy]
resolving_data: [successful sign-ins from the same source, conditional access results]
sources: ["Microsoft Security blog 2026-10-21 Storm-0940 (cross-tenant password spray) accessed 2026-11-20"]
suppressible_by_registry: false
---
id: ARG-AUTH-002
version: 1
title: Failures, then success, then sensitive action by the same identity
description: |
  The same tenant+account had failed sign-ins, then a successful sign-in, then a
  sensitive action (role assignment, credential addition, secret read). Failed and
  successful outcomes are listed separately in the evidence. Timing does not
  matter: slow sequences alert too.
family: auth_sequence
status: test
validation_status: synthetic-scenario tests only
observation_vantage: [identity_cloud]
required_telemetry: [event_time, tenant_id, user]
select:
  any:
    - {field: event_kind, op: eq, value: authentication}
    - {field: event_kind, op: eq, value: cloud_operation}
group_by: [tenant_id, user]
window_s: 86400
aggregate:
  type: sequence
  steps:
    - name: failed_signins
      where: {all: [{field: event_kind, op: eq, value: authentication}, {field: outcome, op: eq, value: failure}]}
      min_count: 3
    - name: successful_signin
      where: {all: [{field: event_kind, op: eq, value: authentication}, {field: outcome, op: eq, value: success}]}
    - name: sensitive_action
      where:
        all:
          - {field: event_kind, op: eq, value: cloud_operation}
          - {field: action, op: in, value: [role_assignment, add_role_member, credential_add, add_service_principal_credentials, secret_read, consent_grant, mfa_method_change]}
reference: {type: not_applicable, description: ordered sequence within 24h; no anomaly claim}
severity: high
base_confidence: high
contributes:
  threat: {activity: Possible account compromise followed by sensitive action, suspicion: likely_malicious}
  purpose: {observed_action: "sign-in failures; a success; then a sensitive operation", hypothesis: privilege_escalation, stage: observed_success}
evidence_family: auth_compromise_chain
required_evidence: Authentication and audit records for the same tenant and account
explanation: "Ordered sequence for {group}: failed sign-ins, success, then sensitive action within {window_s}s."
alternatives: [legitimate user who mistyped and then performed planned admin work, helpdesk password reset followed by setup]
false_positives: [admins with typos]
missing_visibility_hints: ["who controls the account is not established by account ownership"]
resolving_data: [MFA/conditional access details, device of successful sign-in, change ticket for the action]
sources: ["Microsoft Security blog 2026-10-21 (self-assignment of Global Administrator, application credential additions)"]
recommendation: Review the sensitive action and the successful sign-in context with the account owner before any change; preserve logs first.
