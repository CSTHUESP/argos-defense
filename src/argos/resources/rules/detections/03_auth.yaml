id: ARG-AUTH-004
version: 1
title: Uninterrupted failed sign-ins from several sources, then success
description: |
  The same tenant+account had an uninterrupted run (no success in between, from any
  source) of failed sign-ins coming from at least three distinct source addresses,
  followed by a success. Complements ARG-AUTH-003 v2 for guessing that rotates the
  source address on every attempt. Added 2026-11-20 from the labeled tuning set
  (scenario M4); see docs/AUTH_RULE_EVALUATION.md.
family: auth_sequence
status: test
validation_status: synthetic labeled tuning + held-out sequences only; held-out M4 not blind (see evaluation doc); real-world accuracy NOT MEASURED
observation_vantage: [identity_cloud]
required_telemetry: [event_time, tenant_id, user, outcome, src_ip]
select: {field: event_kind, op: eq, value: authentication}
group_by: [tenant_id, user]
window_s: 86400
aggregate:
  type: sequence
  steps:
    - name: failed_signins_multi_source
      where: {field: outcome, op: eq, value: failure}
      min_count: 5
      distinct_field: src_ip
      min_distinct: 3
      reset_where: {field: outcome, op: eq, value: success}
    - {name: successful_signin, where: {field: outcome, op: eq, value: success}}
reference: {type: explicit_threshold, description: ">=5 consecutive failures from >=3 sources for one tenant+account, then success, within 24h"}
severity: medium
base_confidence: medium
contributes:
  threat: {activity: Possible distributed credential guessing success, suspicion: suspicious}
  automation: consistent_with_automation
  purpose: {observed_action: failures from several sources then a successful authentication, hypothesis: credential_access, stage: observed_success}
evidence_family: auth_distributed_fail_then_success
required_evidence: Authentication records with tenant, account, outcome and source address
explanation: "{group}: uninterrupted failures from several sources then a success within {window_s}s."
alternatives: [roaming mobile user with a wrong saved password on several networks, VPN or proxy egress changing per request]
false_positives: [clients behind rotating egress addresses]
missing_visibility_hints: ["attacks that interleave with the real user's successful sign-ins and rotate sources are not matched by AUTH-003 or AUTH-004"]
resolving_data: [whether the success source previously authenticated for this account, device/MFA details]
sources: ["Microsoft Security blog 2026-10-21 (password spray / sign-in attempts at scale)"]
source_history:
  field: src_ip
  where: {all: [{field: event_kind, op: eq, value: authentication}, {field: outcome, op: eq, value: success}]}
  join_fields: [tenant_id, user]
