id: ARG-ARTEX-X02
version: 1
title: "[EXPERIMENTAL] Child process of an 'artex' parent"
description: |
  A process whose parent image is 'artex'. ARTEX workers run tool commands as
  subprocesses with HTTP(S)_PROXY/ALL_PROXY pointing to the recording proxy
  (default 127.0.0.1:8788) and NODE_USE_ENV_PROXY=1. Environment variables are
  rarely present in endpoint telemetry; the parent relationship is the observable part.
family: framework_candidate
status: experimental
validation_status: source-derived candidate; not validated on real telemetry
observation_vantage: [managed_endpoint]
required_telemetry: [event_time, host, parent_image]
select: {all: [{field: event_kind, op: eq, value: process_start}, {field: parent_name, op: in, value: [artex, artex.exe]}]}
group_by: [host]
window_s: 3600
aggregate: {type: each}
reference: {type: not_applicable, description: parent image name match}
severity: medium
base_confidence: low
contributes:
  threat: {activity: Tool execution under possible framework controller, suspicion: suspicious}
  automation: consistent_with_automation
  framework: {name: ARTEX, level: consistent_with, fingerprint_ids: [ARTEX-FP-002], independence_family: controller_process}
  purpose: {observed_action: subprocesses of controller, hypothesis: execution, stage: indicator}
evidence_family: artex_child_process
required_evidence: Process creation with parent image
explanation: "{count} child process(es) of an 'artex' parent on {group}."
alternatives: [renamed unrelated parent]
false_positives: [any parent named artex]
resolving_data: [process environment (HTTP_PROXY=127.0.0.1:8788), listening sockets, binary hash]
sources: ["ARTEX v0.6.0 agent/worker.go proxyEnv() commit a13c68cb"]
fingerprint:
  id: ARTEX-FP-002
  url: https://github.com/BaaRai/ARTEX/blob/a13c68cb7078d43b66fb398db3d610e513b6d77a/agent/worker.go
  commit: a13c68cb7078d43b66fb398db3d610e513b6d77a
  file: agent/worker.go
  location: func proxyEnv, agent/worker.go L215 onward
  observed_pattern: subprocess env HTTP_PROXY/HTTPS_PROXY/ALL_PROXY=<recording proxy>, NODE_USE_ENV_PROXY=1, SSL_CERT_FILE/CURL_CA_BUNDLE/REQUESTS_CA_BUNDLE/GIT_SSL_CAINFO/NODE_EXTRA_CA_CERTS=<MITM CA>
  required_vantage: managed_endpoint (controller host)
  required_telemetry: [parent_image, host, (process environment - usually unavailable)]
  covered_versions: v0.6.0 reviewed
  spoofability: trivial
  benign_overlap: any tool chain behind a local MITM proxy (mitmproxy, Burp)
  validation_status: experimental
