id: ARG-ARTEX-W01
version: 1
title: "[WEAK] Text mentioning ARTEX in User-Agent, URL or file name"
description: |
  The string 'artex' appears in a User-Agent, URL or file path. Trivially spoofable;
  the reviewed source does not set an ARTEX-identifying User-Agent (provider calls
  keep Go's default UA unless a custom one is configured). Never strong attribution.
family: framework_candidate
status: experimental
validation_status: weak text indicator by design
observation_vantage: [victim_network, managed_endpoint]
required_telemetry: [event_time]
select:
  any:
    - {field: http_user_agent, op: contains, value: artex}
    - {field: http_uri, op: contains, value: artex}
    - {field: file_path, op: contains, value: artex}
group_by: []
window_s: 86400
aggregate: {type: each}
reference: {type: not_applicable, description: substring match}
severity: informational
base_confidence: low
contributes:
  threat: {activity: Text mention of a framework name, suspicion: informational}
  framework: {name: ARTEX, level: consistent_with, fingerprint_ids: [], independence_family: null}
  purpose: {observed_action: string present in telemetry, hypothesis: unknown, stage: indicator}
evidence_family: framework_text_mention
required_evidence: Any record containing the text
explanation: "{count} record(s) contain the text 'artex'."
alternatives: [spoofing, researchers, unrelated product named similarly]
false_positives: [anything containing the substring]
resolving_data: [any independent framework fingerprint]
sources: ["ARTEX v0.6.0 agent/user_agent_test.go (default Go-http-client UA when unset) commit a13c68cb"]
