id: ARG-ARTEX-X03
version: 2
title: "[EXPERIMENTAL] Recording-proxy CA file created (mitmproxy naming)"
description: |
  File creation of '_ca/mitmproxy-ca-cert.pem'. ARTEX's traffic recorder stores its
  MITM CA under <traffic dir>/_ca/mitmproxy-ca-cert.pem. The filename is the
  standard mitmproxy name, so benign overlap is very high.
family: framework_candidate
status: experimental
validation_status: source-derived candidate; not validated on real telemetry
observation_vantage: [managed_endpoint]
required_telemetry: [event_time, host, file_path]
select: {all: [{field: event_kind, op: eq, value: file_create}, {field: file_path, op: regex, value: "[\\\\/]_ca[\\\\/]mitmproxy-ca-cert\\.pem$"}]}
group_by: [host]
window_s: 86400
aggregate: {type: each}
reference: {type: not_applicable, description: path pattern}
severity: low
base_confidence: low
contributes:
  threat: {activity: MITM proxy CA created, suspicion: informational}
  # v2: weak indicator - the filename is mitmproxy's standard CA name (very high benign overlap), so it never corroborates.
  framework: {name: ARTEX, level: consistent_with, fingerprint_ids: [ARTEX-FP-003], independence_family: null}
  purpose: {observed_action: proxy CA file written, hypothesis: unknown, stage: indicator}
evidence_family: artex_ca_file
required_evidence: File creation record
explanation: "CA file path consistent with ARTEX traffic recorder on {group}."
alternatives: [mitmproxy or tools embedding go-mitmproxy used for debugging]
false_positives: [developers using mitmproxy]
resolving_data: [parent process of the file write]
sources: ["ARTEX v0.6.0 traffic/traffic.go CACertPath() commit a13c68cb"]
fingerprint:
  id: ARTEX-FP-003
  url: https://github.com/BaaRai/ARTEX/blob/a13c68cb7078d43b66fb398db3d610e513b6d77a/traffic/traffic.go
  commit: a13c68cb7078d43b66fb398db3d610e513b6d77a
  file: traffic/traffic.go
  location: func (t *Traffic) CACertPath, traffic/traffic.go L354-355
  observed_pattern: filepath.Join(dir, "_ca", "mitmproxy-ca-cert.pem")
  required_vantage: managed_endpoint (controller host)
  required_telemetry: [file_path, host]
  covered_versions: v0.6.0 reviewed
  spoofability: trivial
  benign_overlap: very high (standard mitmproxy file name)
  validation_status: experimental
