# Family 7 - ARTEX candidate fingerprints derived from STATIC source review of
# BaaRai/ARTEX tag v0.6.0, commit a13c68cb7078d43b66fb398db3d610e513b6d77a.
# All are EXPERIMENTAL. None is observable from victim-side traffic. Each is
# bounded by observation vantage and version. Rules can only reach
# 'consistent_with'; corroborated presence needs >=2 independent families on the
# same host (computed at case level). Responsibility for an activity is never
# inferred from presence.
id: ARG-ARTEX-X01
version: 1
title: "[EXPERIMENTAL] ARTEX controller binary executed"
description: |
  Process image named 'artex' / 'artex.exe' started. Relevant only on a host that
  RUNS the controller (e.g. an insider or compromised machine in your estate).
family: framework_candidate
status: experimental
validation_status: source-derived candidate; not validated on real telemetry
observation_vantage: [managed_endpoint]
required_telemetry: [event_time, host, process_image]
select: {all: [{field: event_kind, op: eq, value: process_start}, {field: process_name, op: in, value: [artex, artex.exe]}]}
group_by: [host]
window_s: 86400
aggregate: {type: each}
reference: {type: not_applicable, description: image name match}
severity: medium
base_confidence: low
contributes:
  threat: {activity: Possible agentic offensive framework controller started, suspicion: suspicious}
  framework: {name: ARTEX, level: consistent_with, fingerprint_ids: [ARTEX-FP-001], independence_family: controller_process}
  purpose: {observed_action: controller binary executed, hypothesis: unknown, stage: indicator}
evidence_family: artex_controller_process
required_evidence: Process creation with image path
explanation: "Process image matching the ARTEX build output name on {group}."
alternatives: [authorized penetration-testing team, unrelated binary with the same name]
false_positives: [any file named artex]
resolving_data: [binary hash compared with a build you produced from the reviewed commit, listening sockets 127.0.0.1:8787/8788, parent/user]
sources: ["ARTEX v0.6.0 cmd/artex/main.go (binary name, -addr 127.0.0.1:8787, -proxy 127.0.0.1:8788) commit a13c68cb"]
fingerprint:
  id: ARTEX-FP-001
  url: https://github.com/BaaRai/ARTEX/blob/a13c68cb7078d43b66fb398db3d610e513b6d77a/cmd/artex/main.go
  commit: a13c68cb7078d43b66fb398db3d610e513b6d77a
  file: cmd/artex/main.go
  location: cmd/artex/main.go L53 (-addr), L55 (-proxy); binary name build.sh L207-208, install.sh L112-115 (overridable via ARTEX_OUTPUT, build.sh L210)
  observed_pattern: binary built from cmd/artex (default name 'artex'); default listen 127.0.0.1:8787 and recording proxy 127.0.0.1:8788
  required_vantage: managed_endpoint (controller host only)
  required_telemetry: [process_image, host]
  covered_versions: v0.6.0 reviewed; other forks unknown
  spoofability: trivial (rename binary, change flags)
  benign_overlap: authorized security testing; unrelated programs named artex
  validation_status: experimental
