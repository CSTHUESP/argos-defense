id: ARG-ARTEX-X04
version: 1
title: "[EXPERIMENTAL] Model-gateway session ids in ARTEX format"
description: |
  Model audit/gateway records whose session id matches ARTEX's transcript session
  naming (exp<N>-planner, exp<N>-main[-s<N>], exp<N>-worker-i<N>, exp<N>-goals,
  exp<N>-compactor, exp<N>-btw-*). ARTEX sends the session id to the provider only
  when a profile sets session_header_key (default empty), so this is visible only
  to a gateway the controller's traffic passes through.
family: framework_candidate
status: experimental
validation_status: source-derived candidate; not validated on real telemetry
observation_vantage: [agent_or_model_audit]
required_telemetry: [event_time, session_id]
select:
  all:
    - {field: event_kind, op: eq, value: model_interaction}
    - {field: session_id, op: regex, value: "^exp[0-9]+-(planner|main(-s[0-9]+)?|worker-i[0-9]+|goals|compactor|btw-.+)$"}
group_by: [session_id]
window_s: 86400
aggregate: {type: each}
reference: {type: not_applicable, description: session id naming pattern}
severity: medium
base_confidence: low
contributes:
  threat: {activity: Possible agentic framework model traffic, suspicion: suspicious}
  automation: consistent_with_automation
  llm: directly_observed
  framework: {name: ARTEX, level: consistent_with, fingerprint_ids: [ARTEX-FP-004], independence_family: model_session_naming}
  purpose: {observed_action: model calls with framework-like session ids, hypothesis: unknown, stage: indicator}
evidence_family: artex_session_naming
required_evidence: Model gateway records with session ids
explanation: "Session {group} follows ARTEX session naming ({count} record(s))."
alternatives: [other software using 'expN-' prefixes, deliberate imitation]
false_positives: [experiment-tracking tools]
resolving_data: [request bodies (worker system prompt template), source host of the calls, gateway authentication identity]
sources: ["ARTEX v0.6.0 agent/worker.go:101, planner.go:519, mainagent.go:176-178, goals.go:124, compaction.go:96, server/side_questions.go:431; agent/provider.go:457-460 (session header) commit a13c68cb"]
fingerprint:
  id: ARTEX-FP-004
  url: https://github.com/BaaRai/ARTEX/blob/a13c68cb7078d43b66fb398db3d610e513b6d77a/agent/worker.go#L101
  commit: a13c68cb7078d43b66fb398db3d610e513b6d77a
  file: agent/worker.go, agent/planner.go, agent/mainagent.go, agent/goals.go, agent/compaction.go, server/side_questions.go, agent/provider.go
  location: worker.go L101, planner.go L519, mainagent.go L176/L178, goals.go L124, compaction.go L96, side_questions.go L431; provider.go L457 sets the header only if session_header_key != ""
  observed_pattern: "^exp\\d+-(planner|main(-s\\d+)?|worker-i\\d+|goals|compactor|btw-.+)$"
  required_vantage: agent_or_model_audit (gateway on controller egress path)
  required_telemetry: [session_id]
  covered_versions: v0.6.0 reviewed
  spoofability: trivial
  benign_overlap: low-moderate (generic prefix)
  validation_status: experimental
