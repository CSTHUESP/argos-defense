# Family 6 - model interactions linked to tool execution.
# An AI-provider connection alone is insufficient for LLM-driven execution.
id: ARG-LLM-001
version: 1
title: Connection to an AI model provider
description: |
  A host or source contacted a known AI model API domain. This establishes only that
  the connection was observed. It is not evidence of malicious activity nor of
  model-driven actions.
family: model_tool_linkage
status: test
validation_status: synthetic-scenario tests only
observation_vantage: [victim_network, managed_endpoint]
required_telemetry: [event_time, domain]
select:
  all:
    - {field: event_kind, op: in, value: [dns, http, network_connection]}
    - {field: domain, op: endswith, value: [api.openai.com, api.anthropic.com, generativelanguage.googleapis.com, api.deepseek.com, api.mistral.ai, open.bigmodel.cn, api.x.ai, openrouter.ai, api.groq.com, api.together.xyz]}
group_by: [domain]
window_s: 3600
aggregate: {type: each}
reference: {type: not_applicable, description: domain list match}
severity: informational
base_confidence: medium
contributes:
  threat: {activity: AI provider connection observed, suspicion: informational}
  llm: possible
  purpose: {observed_action: connection to AI API, hypothesis: unknown, stage: indicator}
evidence_family: ai_provider_connection
required_evidence: DNS/HTTP/connection records naming the provider domain
explanation: "{count} connection record(s) to {group}. Observation of a connection only."
alternatives: [sanctioned AI assistant use, developer tooling, browser extensions]
false_positives: [all legitimate AI usage]
resolving_data: [model gateway/audit records linking requests to actions, endpoint process making the connection]
sources: ["FBI FLASH-20261113-001: outbound API destinations to investigate in context"]
---
id: ARG-LLM-002
version: 2
title: Model tool call followed by the matching agent tool execution (explicit call link)
description: |
  Agent/model audit records show a model response requesting a tool call and an executed tool call that
  carries the SAME call identifier within the same namespaced session (collection source + tenant +
  session id), and the executed tool equals the requested tool. Supports directly observed LLM involvement
  in that chain, according to the supplied audit records. v2: session strings alone never link records
  across sources/tenants; identifiers are compared case-sensitively; host need not match (distributed
  executors are linked by the explicit call identifier).
family: model_tool_linkage
status: test
validation_status: synthetic-scenario tests only
observation_vantage: [agent_or_model_audit]
required_telemetry: [event_time, session_key, tool_call_id]
select: {field: event_kind, op: in, value: [model_interaction, tool_execution]}
group_by: [call_key]
window_s: 600
aggregate:
  type: sequence
  steps:
    - {name: model_tool_call, where: {all: [{field: event_kind, op: eq, value: model_interaction}, {field: model_tool_name, op: exists}]}}
    - name: tool_execution
      where: {all: [{field: event_kind, op: eq, value: tool_execution}, {field: tool_name, op: exists}]}
      same_as: {step: model_tool_call, field: tool_name, step_field: model_tool_name}
reference: {type: not_applicable, description: explicit call-identifier linkage in one namespaced session}
severity: informational
base_confidence: high
contributes:
  threat: {activity: Model-directed tool execution recorded, suspicion: informational}
  automation: observed_automation
  llm: directly_observed
  purpose: {observed_action: model requested a tool and the agent executed the same tool call, hypothesis: unknown, stage: observed_success}
evidence_family: model_audit_tool_chain
required_evidence: model_interaction with tool name + call id, and tool_execution with the same call id and tool name
explanation: "Call {group}: model requested the tool and the same call was executed within {window_s}s."
alternatives: [sanctioned internal agent, developer testing an agent, audit records fabricated or replayed (provenance unverified)]
false_positives: [authorized AI agents]
missing_visibility_hints: ["records without call identifiers are only reported as 'possible' (ARG-LLM-005)"]
resolving_data: [authenticity of the audit source (gateway signing, collection path), process telemetry for the executed tool]
sources: ["ARTEX v0.6.0 llmrec/llmrec.go + db/commands.go llm_records (per-call request/response with session_id) commit a13c68cb"]
suppressible_by_registry: true
---
id: ARG-LLM-003
version: 2
title: Model tool request linked to an endpoint process (same host and ProcessGuid)
description: |
  A model_interaction audit record that requests a tool names the endpoint process started for it
  (linked_process_guid), and endpoint telemetry shows that process starting on the same host. v2: a generic
  tool_execution record is NOT model evidence; that case is reported by ARG-AUTO-003 with LLM involvement unknown.
family: model_tool_linkage
status: test
validation_status: synthetic-scenario tests only
observation_vantage: [agent_or_model_audit, managed_endpoint]
required_telemetry: [event_time, host, proc_link]
select:
  any:
    - {all: [{field: event_kind, op: eq, value: model_interaction}, {field: model_tool_name, op: exists}]}
    - {field: event_kind, op: eq, value: process_start}
group_by: [host, proc_link]
window_s: 600
aggregate:
  type: sequence
  steps:
    - {name: model_tool_request, where: {field: event_kind, op: eq, value: model_interaction}}
    - {name: endpoint_process, where: {field: event_kind, op: eq, value: process_start}}
reference: {type: not_applicable, description: identifier linkage}
severity: low
base_confidence: high
contributes:
  threat: {activity: Model-linked process execution on endpoint, suspicion: suspicious}
  automation: observed_automation
  llm: directly_observed
  purpose: {observed_action: process started for a model tool request, hypothesis: execution, stage: observed_success}
evidence_family: model_audit_process_link
required_evidence: model_interaction with model_tool_name and linked_process_guid + endpoint process_start with that ProcessGuid on the same host
explanation: "Model tool request and endpoint process share {group} within {window_s}s."
alternatives: [authorized AI coding assistant running commands, audit records with unverified provenance]
false_positives: [developer agents]
resolving_data: [what the process did next (file/network events), who started the agent]
sources: ["ARTEX v0.6.0 agent/worker.go (bash subprocess per tool call) commit a13c68cb"]
---
id: ARG-AUTO-003
version: 1
title: Agent tool execution linked to an endpoint process (no model evidence)
description: |
  An agent/automation audit record of a tool execution names the endpoint process it started
  (linked_process_guid), and endpoint telemetry shows that process on the same host. This establishes an
  automation-to-process link only; without a model_interaction record, LLM involvement remains UNKNOWN.
family: automation_burst
status: test
validation_status: synthetic-scenario tests only
observation_vantage: [agent_or_model_audit, managed_endpoint]
required_telemetry: [event_time, host, proc_link]
select: {field: event_kind, op: in, value: [tool_execution, process_start]}
group_by: [host, proc_link]
window_s: 600
aggregate:
  type: sequence
  steps:
    - {name: tool_execution_record, where: {field: event_kind, op: eq, value: tool_execution}}
    - {name: endpoint_process, where: {field: event_kind, op: eq, value: process_start}}
reference: {type: not_applicable, description: identifier linkage}
severity: informational
base_confidence: high
contributes:
  threat: {activity: Automated tool execution linked to endpoint process, suspicion: informational}
  automation: observed_automation
  purpose: {observed_action: automation record and the process it started, hypothesis: unknown, stage: observed_success}
evidence_family: automation_process_link
required_evidence: tool_execution with linked_process_guid + process_start with that ProcessGuid on the same host
explanation: "Automation record and endpoint process share {group} within {window_s}s; no model record is linked."
alternatives: [scheduled job runner, CI agent, RMM tool, LLM agent whose model calls were not supplied]
false_positives: [any automation framework]
resolving_data: [model/gateway audit records for the same session and call]
sources: ["audit finding F01 (2026-11-20)"]
suppressible_by_registry: true
