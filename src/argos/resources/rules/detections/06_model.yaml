id: ARG-LLM-005
version: 1
title: Model tool request and execution in the same session without a call link (possible)
description: |
  In the same namespaced session and on the same host, a model requested a tool and an execution of the same
  tool was recorded, but no call identifier links the two. Consistent with model involvement; not a direct
  observation.
family: model_tool_linkage
status: test
validation_status: synthetic-scenario tests only
observation_vantage: [agent_or_model_audit]
required_telemetry: [event_time, session_key, host]
select:
  all:
    - {field: event_kind, op: in, value: [model_interaction, tool_execution]}
    - {field: tool_call_id, op: not_exists}
group_by: [session_key, host]
window_s: 600
aggregate:
  type: sequence
  steps:
    - {name: model_tool_call, where: {all: [{field: event_kind, op: eq, value: model_interaction}, {field: model_tool_name, op: exists}]}}
    - name: tool_execution
      where: {all: [{field: event_kind, op: eq, value: tool_execution}, {field: tool_name, op: exists}]}
      same_as: {step: model_tool_call, field: tool_name, step_field: model_tool_name}
reference: {type: not_applicable, description: "same namespaced session + host + tool name; no call id"}
severity: informational
base_confidence: medium
contributes:
  threat: {activity: Possible model-directed tool execution, suspicion: informational}
  automation: observed_automation
  llm: possible
  purpose: {observed_action: model tool request and same-tool execution in one session, hypothesis: unknown, stage: indicator}
evidence_family: model_audit_unlinked
required_evidence: model_interaction + tool_execution in the same namespaced session and host, same tool name
explanation: "Session {group}: same tool requested and executed within {window_s}s, but no call identifier links them."
alternatives: [coincidental execution of the same tool by another actor in the session]
false_positives: [busy multi-agent sessions]
resolving_data: [call identifiers in the audit source]
sources: ["audit finding F02 (2026-11-20)"]
---
id: ARG-LLM-004
version: 1
title: Human approval recorded in agent audit
description: An agent audit record shows a human approval/denial decision for a tool call (human-in-the-loop). Evidence of a manual component.
family: model_tool_linkage
status: test
validation_status: synthetic-scenario tests only
observation_vantage: [agent_or_model_audit]
required_telemetry: [event_time, session_id]
select: {field: event_kind, op: eq, value: human_approval}
group_by: [session_id]
window_s: 3600
aggregate: {type: each}
reference: {type: not_applicable, description: record presence}
severity: informational
base_confidence: high
contributes:
  threat: {activity: Human approval in agent workflow, suspicion: informational}
  automation: observed_manual_component
  purpose: {observed_action: human decision on agent tool call, hypothesis: unknown, stage: observed_success}
evidence_family: human_approval_record
required_evidence: human_approval audit records
explanation: "{count} human decision record(s) in session {group}."
alternatives: [automated approver mislabelled as human]
false_positives: []
resolving_data: [identity of approver, approval UI logs]
sources: ["ARTEX v0.6.0 intercept/intercept.go + db/intercept.go (ask/approve, decided_by) commit a13c68cb"]
