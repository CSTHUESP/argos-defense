id: ARG-ENUM-002
version: 1
title: Repeated failures followed by success on a new path (adaptation hypothesis)
description: |
  A source produced repeated failing requests and then a successful request to the
  same host within the window. This supports - but does not prove - an
  exploration/adaptation hypothesis. What changed between attempts is shown in the
  evidence; intent is not observed.
family: enumeration_adaptation
status: test
validation_status: synthetic-scenario tests only
observation_vantage: [victim_network]
required_telemetry: [event_time, src_ip, http_status]
select: {field: event_kind, op: eq, value: http}
group_by: [src_ip, http_host]
window_s: 900
aggregate:
  type: sequence
  steps:
    - {name: failures, where: {field: http_status, op: in, value: [400, 401, 403, 404, 405, 422, 500]}, min_count: 15, distinct_field: uri_path, min_distinct: 5}
    - {name: success, where: {field: http_status_class, op: eq, value: 2xx}, min_count: 1}
reference: {type: explicit_threshold, description: ">=15 failures over >=5 paths, then a 2xx, within 900s"}
severity: low
base_confidence: low
contributes:
  threat: {activity: Failure sequence followed by success, suspicion: suspicious}
  purpose: {observed_action: failures then a successful response, hypothesis: initial_access, stage: attempt}
evidence_family: http_failure_then_success
required_evidence: Ordered HTTP records for the same source and host
explanation: "Failures then success from {group} within {window_s}s. Observed: response codes. Not observed: the requester's intent or decision process."
alternatives: [user correcting a typo, client retry logic, scanner reaching a valid page]
false_positives: [API clients with retries]
resolving_data: [request bodies/parameters, application logs for the successful request]
sources: ["ARTEX v0.6.0 agent/worker.go worker prompt (walks bypass means after setbacks) commit a13c68cb"]
suppressible_by_registry: true
