# Family 2 - broad enumeration and failure/strategy-change sequences.
id: ARG-ENUM-001
version: 1
title: Broad HTTP path enumeration with mostly failing responses
description: |
  One source requested many distinct paths on one host, most of which failed
  (4xx). Supports a reconnaissance hypothesis; the actor and tooling are unknown.
family: enumeration_adaptation
status: test
validation_status: synthetic-scenario tests only; real-world accuracy NOT MEASURED
observation_vantage: [victim_network]
required_telemetry: [event_time, src_ip, http_uri, http_status]
select: {field: event_kind, op: eq, value: http}
group_by: [src_ip, http_host]
window_s: 300
aggregate:
  type: threshold
  min_count: 40
  distinct_field: uri_path
  min_distinct: 30
  ratio_where: {field: http_status_class, op: eq, value: 4xx}
  min_ratio: 0.6
reference: {type: explicit_threshold, description: ">=30 distinct paths, >=40 requests, >=60% 4xx within 300s"}
severity: low
base_confidence: medium
contributes:
  threat: {activity: Web content/endpoint enumeration, suspicion: suspicious}
  automation: consistent_with_automation
  purpose: {observed_action: "many distinct paths requested; mostly failing", hypothesis: reconnaissance, stage: attempt}
evidence_family: http_enumeration
required_evidence: HTTP records with URI and status
explanation: "{count} requests to {distinct} distinct paths from {group} within {window_s}s; 4xx ratio {ratio}."
alternatives: [authorized scanner, broken client following stale links, SEO crawler]
false_positives: [link checkers, misconfigured health checks]
resolving_data: [authorized scanner inventory, WAF decision logs]
sources: ["CERT-EU blog 2026-11-05 (automated scanning patterns)", "FBI FLASH-20261113-001 accessed 2026-11-20"]
suppressible_by_registry: true
