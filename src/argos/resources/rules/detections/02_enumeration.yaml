id: ARG-ENUM-003
version: 1
title: Port sweep from one source
description: One source contacted many distinct destination ports within a minute (network connection logs).
family: enumeration_adaptation
status: test
validation_status: synthetic-scenario tests only
observation_vantage: [victim_network]
required_telemetry: [event_time, src_ip, dst_port]
select: {field: event_kind, op: eq, value: network_connection}
group_by: [src_ip]
window_s: 60
aggregate: {type: threshold, min_count: 20, distinct_field: dst_port, min_distinct: 20}
reference: {type: explicit_threshold, description: ">=20 distinct destination ports within 60s"}
severity: low
base_confidence: medium
contributes:
  threat: {activity: Port sweep, suspicion: suspicious}
  automation: consistent_with_automation
  purpose: {observed_action: many destination ports contacted, hypothesis: reconnaissance, stage: attempt}
evidence_family: port_sweep
required_evidence: Connection records with destination port
explanation: "{distinct} distinct destination ports contacted by {group} within {window_s}s."
alternatives: [authorized vulnerability scan, service discovery, P2P application]
false_positives: [network monitoring, asset discovery tools]
resolving_data: [authorized scanner inventory]
sources: ["MITRE-referenced 'Active Scanning' in CERT-EU 2026-11-05 and Microsoft 2026-10-21 posts"]
suppressible_by_registry: true
