name: Create release tag

# Run manually from the Actions tab (owner/maintainer). Applies the SAME shared preflight as
# release.yml (packaging/release_preflight.py --mode create-tag): semantic version, pyproject and
# package version equal to the input, release notes present, commit on main, successful CI for
# that exact SHA, and the tag must not already exist (version tags are never moved). Then creates
# an annotated tag, verifies it on the remote, and dispatches release.yml for that tag
# (draft only unless publish=true; publication still requires uploaded-byte verification).
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the leading v (must equal pyproject version), e.g. 0.3.0"
        required: true
      commit:
        description: "Full 40-character commit SHA to tag"
        required: true
      publish:
        description: "Publish the release after the draft passes verification"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  tag:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write   # create the tag
      actions: write    # dispatch release.yml
    env:
      VERSION: ${{ inputs.version }}
      COMMIT: ${{ inputs.commit }}
      PUBLISH: ${{ inputs.publish }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Shared preflight (create-tag mode)
        run: python3 packaging/release_preflight.py --mode create-tag --version "$VERSION" --sha "$COMMIT"
      - name: Create and push annotated tag
        run: |
          TAG="v$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$COMMIT" -m "ARGOS Defense $VERSION (experimental detection; real-world accuracy not measured)"
          git push origin "refs/tags/$TAG"
          python3 packaging/release_preflight.py --mode recheck --tag "$TAG" --expect-sha "$COMMIT"
      - name: Start release build
        run: gh workflow run release.yml --ref main -f tag="v$VERSION" -f publish="$PUBLISH"
