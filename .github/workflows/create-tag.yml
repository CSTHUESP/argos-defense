name: Create release tag

# Run manually from the Actions tab. Creates an annotated version tag on a reviewed commit
# that is on main and has a successful CI run, then starts release.yml for that tag
# (release.yml only produces a DRAFT release; publication is a separate step).
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the leading v (must equal pyproject version), e.g. 0.2.0"
        required: true
      commit:
        description: "Full 40-character commit SHA to tag"
        required: true

permissions:
  contents: read

jobs:
  tag:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write   # create the tag
      actions: write    # dispatch release.yml
    env:
      VERSION: ${{ inputs.version }}
      COMMIT: ${{ inputs.commit }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Validate inputs and commit
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "bad version"; exit 1; }
          [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "commit must be a full SHA"; exit 1; }
          TAG="v$VERSION"
          if git ls-remote --exit-code origin "refs/tags/$TAG" >/dev/null; then echo "$TAG already exists - tags are never moved"; exit 1; fi
          git merge-base --is-ancestor "$COMMIT" origin/main || { echo "commit is not on main"; exit 1; }
          test "$(git show "$COMMIT:pyproject.toml" | sed -n 's/^version = "\(.*\)"/\1/p')" = "$VERSION" || { echo "pyproject version differs"; exit 1; }
          test "$(git show "$COMMIT:src/argos/__init__.py" | sed -n 's/^__version__ = "\(.*\)"/\1/p')" = "$VERSION" || { echo "package version differs"; exit 1; }
          git show "$COMMIT:docs/release-notes/$TAG.md" >/dev/null || { echo "release notes missing"; exit 1; }
          OK=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$COMMIT&status=success" --jq '.total_count')
          test "$OK" -ge 1 || { echo "no successful CI run for $COMMIT"; exit 1; }
          echo "TAG=$TAG" >> "$GITHUB_ENV"
      - name: Create and push annotated tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$COMMIT" -m "ARGOS Defense $VERSION (experimental detection; real-world accuracy not measured)"
          git push origin "refs/tags/$TAG"
          test "$(git ls-remote origin "refs/tags/$TAG^{}" | cut -f1)" = "$COMMIT"
          echo "tag $TAG -> $COMMIT verified on remote"
      - name: Start release build (draft only)
        run: gh workflow run release.yml --ref main -f tag="$TAG"
