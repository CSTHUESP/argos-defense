[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "argos-defense"
version = "0.3.1"
description = "Local defensive investigation of supplied telemetry: automation, LLM-involvement and framework evidence with explicit uncertainty"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "ARGOS Defense contributors"}]
keywords = ["security", "detection", "incident-response", "dfir", "llm"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Web Environment",
  "Intended Audience :: Information Technology",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = [
  "starlette>=0.40",
  "uvicorn>=0.30",
  "pydantic>=2.6",
  "jinja2>=3.1",
  "PyYAML>=6.0",
  "defusedxml>=0.7",
  "python-multipart>=0.0.9",
  "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
test = ["pytest>=8", "psutil>=5.9"]

[project.scripts]
argos-defense = "argos.cli:main"
argos = "argos.cli:main"

[project.urls]
Repository = "https://github.com/CSTHUESP/argos-defense"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
argos = ["templates/*.html", "static/*", "resources/rules/detections/*.yaml", "resources/rules/iocs/*.yaml",
         "resources/config/*.yaml", "resources/notices/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
